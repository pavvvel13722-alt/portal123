<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дубли обращений (сырая версия)</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="page">
        <header class="page__header">
            <div class="page__title">
                <h1>Прототип: поиск дублей</h1>
                <p class="page__subtitle">Сырая версия для предварительного просмотра логики.</p>
            </div>
            <div class="page__header-actions">
                <div class="upload">
                    <label for="csv-file" class="upload__label">Загрузить CSV (UTF-8 BOM)</label>
                    <input type="file" id="csv-file" accept=".csv">
                    <span id="upload-info" class="upload__info">Файл не загружен</span>
                </div>
                <button id="theme-toggle" class="button button--ghost" type="button">Тёмная тема</button>
            </div>
        </header>
        <main class="single-panel">
            <section class="section-card">
                <div class="section-card__header">
                    <h2>Настройки и запуск</h2>
                </div>
                <div class="section-card__body section-card__body--gap">
                    <div id="duplicate-settings" class="settings settings--compact"></div>
                    <div class="section-card__actions">
                        <button id="btn-run-duplicates" class="button button--primary" type="button" disabled>Найти дубли</button>
                        <button id="btn-export-duplicates" class="button" type="button" disabled>Экспорт дублей (CSV)</button>
                    </div>
                </div>
            </section>
            <section class="section-card section-card--results">
                <div class="section-card__header">
                    <h2>Найденные кластеры</h2>
                </div>
                <div id="duplicate-results" class="results"></div>
            </section>
        </main>
    </div>
    <div class="modal modal--wide" id="compare-modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal__backdrop" data-modal-close></div>
        <div class="modal__dialog">
            <header class="modal__header">
                <h3 id="compare-modal-title">Сравнение описаний</h3>
                <button class="modal__close" type="button" data-modal-close aria-label="Закрыть">Закрыть</button>
            </header>
            <div class="modal__body compare-modal__body" id="compare-modal-body"></div>
        </div>
    </div>
    <div hidden>
        <button id="btn-run-search" type="button"></button>
        <button id="btn-export-search" type="button"></button>
        <button id="btn-run-tags" type="button"></button>
        <button id="btn-export-tags-csv" type="button"></button>
        <button id="btn-export-tags-json" type="button"></button>
    </div>
    <script src="../../js/vendor/papaparse.min.js"></script>
    <script src="../../js/vendor/flexsearch.min.js"></script>
    <script src="../../js/app.core.shared.js"></script>
    <script src="../../js/app.core.js"></script>
    <script src="../../js/app.dups.engine.js"></script>
    <script src="../../js/app.dups.js"></script>
</body>
</html>
