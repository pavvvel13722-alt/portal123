<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портал обращений - версия 0.1</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="page" style="max-width:960px;margin:0 auto;padding:32px;">
        <h1 style="margin-bottom:24px;">Портал обработки обращений (версия 0.1)</h1>
        <section style="border:1px solid #d0d0d0;padding:24px;border-radius:12px;background:#ffffff;">
            <h2 style="margin-top:0;">Импорт CSV</h2>
            <p>На этом этапе реализована только загрузка файла и вывод названия. Аналитика ещё не подключена.</p>
            <label for="csv-file">Выберите CSV (UTF-8 BOM)</label>
            <input id="csv-file" type="file" accept=".csv" style="display:block;margin-top:12px;">
            <p id="file-info" style="margin-top:16px;color:#666666;">Файл не выбран</p>
        </section>
    </div>
    <script>
    (function(){
        var input = document.getElementById('csv-file');
        var info = document.getElementById('file-info');
        if (!input || !info) return;
        input.addEventListener('change', function(){
            if (!input.files || !input.files.length) {
                info.textContent = 'Файл не выбран';
                return;
            }
            info.textContent = 'Загружен файл: ' + input.files[0].name;
        });
    })();
    </script>
</body>
</html>
