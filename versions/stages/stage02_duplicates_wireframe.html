<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портал обращений - версия 0.2</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .stage-container {
            max-width: 1000px;
            margin: 24px auto 64px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .stage-note {
            margin: 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="page__header">
            <div class="page__title">
                <h1>Портал обработки обращений</h1>
                <p>Версия 0.2: первые кластеры дублей по автору и совпадающим описаниям.</p>
            </div>
            <div class="page__header-actions">
                <div class="upload">
                    <label for="csv-file" class="upload__label">Загрузить CSV</label>
                    <input id="csv-file" type="file" accept=".csv">
                    <span id="upload-info" class="upload__info">Файл не выбран</span>
                </div>
            </div>
        </header>
        <main class="stage-container">
            <section class="section-card">
                <div class="section-card__header">
                    <h2>Сводка</h2>
                </div>
                <div class="section-card__body">
                    <div class="duplicates-summary" id="summary-box">
                        <span id="summary-total">0 обращений</span>
                        <span id="summary-groups">0 групп дублей</span>
                    </div>
                    <p class="stage-note" id="summary-note">Загрузите выгрузку, чтобы увидеть повторяющиеся обращения.</p>
                </div>
            </section>
            <section class="section-card section-card--results">
                <div class="section-card__header">
                    <h2>Найденные кластеры</h2>
                </div>
                <div class="section-card__body">
                    <div id="duplicate-results" class="results">
                        <div class="empty-state" id="empty-state">Пока нет совпадений.</div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="../../js/app.core.shared.js"></script>
    <script>
    (function(){
        function getShared(){
            if (window && window.AppCoreShared) {
                return window.AppCoreShared;
            }
            return null;
        }
        function trimValue(value){
            if (value == null) {
                return '';
            }
            return String(value).replace(/\s+/g, ' ').trim();
        }
        function normalizeAuthor(value){
            var text = trimValue(value).toLowerCase();
            return text.replace(/ё/g, 'е');
        }
        function parseRecords(text){
            var shared = getShared();
            if (!shared) {
                return [];
            }
            var parsed = null;
            try {
                parsed = shared.autoParseCsv(text);
            } catch (err) {
                parsed = null;
            }
            var columns = parsed && parsed.meta && parsed.meta.fields ? parsed.meta.fields : [];
            var data = parsed && parsed.data ? parsed.data : [];
            if (!data.length) {
                try {
                    var fallback = shared.parseCsv(text, { delimiter: ';', header: true, skipEmptyLines: true });
                    if (fallback) {
                        data = fallback.data || [];
                        if (!columns.length && fallback.meta && fallback.meta.fields) {
                            columns = fallback.meta.fields;
                        }
                    }
                } catch (errParse) {
                    data = [];
                }
            }
            var normalized = [];
            for (var i = 0; i < data.length; i += 1) {
                var normalizedRow = shared.normalizeRow(data[i], columns);
                if (normalizedRow && (normalizedRow.author || normalizedRow.description)) {
                    normalized.push(normalizedRow);
                }
            }
            return normalized;
        }
        function groupRecords(rows){
            var map = {};
            for (var i = 0; i < rows.length; i += 1) {
                var row = rows[i];
                var author = normalizeAuthor(row.author || row.requester || row.contact || '');
                var description = trimValue(row.description || '');
                if (!author || !description) {
                    continue;
                }
                var key = author + '|' + description;
                if (!map[key]) {
                    map[key] = [];
                }
                map[key].push(row);
            }
            var keys = Object.keys(map);
            var result = [];
            for (var k = 0; k < keys.length; k += 1) {
                var group = map[keys[k]];
                if (group.length > 1) {
                    result.push(group);
                }
            }
            return result;
        }
        function renderGroup(container, group){
            var cluster = document.createElement('article');
            cluster.className = 'cluster';
            var header = document.createElement('div');
            header.className = 'cluster__header';
            var top = document.createElement('div');
            top.className = 'cluster__top';
            var title = document.createElement('h3');
            title.className = 'cluster__title';
            var first = group[0];
            var author = trimValue(first.author || first.requester || first.contact || 'Не указан автор');
            title.textContent = 'Автор: ' + author;
            var count = document.createElement('span');
            count.className = 'cluster__stats';
            count.textContent = group.length + ' обращений';
            top.appendChild(title);
            top.appendChild(count);
            header.appendChild(top);
            cluster.appendChild(header);
            var list = document.createElement('div');
            list.className = 'record-list';
            for (var i = 0; i < group.length; i += 1) {
                var row = group[i];
                var record = document.createElement('article');
                record.className = 'record' + (i === 0 ? ' record--primary' : ' record--duplicate');
                var idField = document.createElement('div');
                idField.className = 'record__field record__id';
                var idLabel = document.createElement('span');
                idLabel.className = 'record__badge';
                idLabel.textContent = i === 0 ? 'master' : 'duplicate';
                var idLink = document.createElement('a');
                idLink.href = 'https://sfera.vtb.ru/sd/support?open=' + encodeURIComponent(row.id || '');
                idLink.textContent = row.id || 'Без номера';
                idLink.target = '_blank';
                idLink.rel = 'noopener';
                idField.appendChild(idLabel);
                idField.appendChild(idLink);
                var descField = document.createElement('div');
                descField.className = 'record__field';
                var descTitle = document.createElement('strong');
                descTitle.textContent = 'Описание';
                var descText = document.createElement('p');
                descText.className = 'record__snippet';
                descText.textContent = row.description || 'Без описания';
                descField.appendChild(descTitle);
                descField.appendChild(descText);
                record.appendChild(idField);
                record.appendChild(descField);
                list.appendChild(record);
            }
            cluster.appendChild(list);
            container.appendChild(cluster);
        }
        function render(groups, total){
            var container = document.getElementById('duplicate-results');
            var summaryTotal = document.getElementById('summary-total');
            var summaryGroups = document.getElementById('summary-groups');
            var summaryNote = document.getElementById('summary-note');
            var empty = document.getElementById('empty-state');
            if (!container || !summaryTotal || !summaryGroups || !summaryNote) {
                return;
            }
            container.innerHTML = '';
            summaryTotal.textContent = total + ' обращений';
            summaryGroups.textContent = groups.length + ' групп дублей';
            if (!groups.length) {
                summaryNote.textContent = 'Совпадений не найдено. На этом этапе проверяем только совпадение текста описания.';
                if (empty) {
                    empty.textContent = 'Совпадения не обнаружены.';
                    container.appendChild(empty);
                }
                return;
            }
            summaryNote.textContent = 'Группы сформированы по автору и точному совпадению описания.';
            for (var i = 0; i < groups.length; i += 1) {
                renderGroup(container, groups[i]);
            }
        }
        function handleFile(text){
            var records = parseRecords(text);
            var groups = groupRecords(records);
            render(groups, records.length);
        }
        function readFile(file){
            var reader = new FileReader();
            reader.onload = function(event){
                handleFile(event.target && event.target.result ? event.target.result : '');
            };
            reader.readAsText(file, 'utf-8');
        }
        var input = document.getElementById('csv-file');
        var info = document.getElementById('upload-info');
        if (!input || !info) {
            return;
        }
        input.addEventListener('change', function(){
            if (!input.files || !input.files.length) {
                info.textContent = 'Файл не выбран';
                render([], 0);
                return;
            }
            var file = input.files[0];
            info.textContent = 'Загружаем: ' + file.name;
            readFile(file);
        });
    })();
    </script>
</body>
</html>
