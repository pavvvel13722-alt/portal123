<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портал обращений - версия 0.5</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .stage-container {
            max-width: 1120px;
            margin: 24px auto 72px;
            padding: 0 24px 48px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .stage-table {
            width: 100%;
            border-collapse: collapse;
        }
        .stage-table thead {
            background: var(--bg-subtle);
            color: var(--text-secondary);
        }
        .stage-table th,
        .stage-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            vertical-align: top;
        }
        .stage-table tbody tr:hover {
            background: var(--bg-subtle);
        }
        .tabs__tab[disabled] {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .search-inline {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .search-inline input {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="page__header">
            <div class="page__title">
                <h1>Портал обработки обращений</h1>
                <p>Версия 0.5: макет с вкладками и первым текстовым поиском.</p>
            </div>
            <div class="page__header-actions">
                <div class="upload">
                    <label for="csv-file" class="upload__label">Загрузить CSV</label>
                    <input id="csv-file" type="file" accept=".csv">
                    <span id="upload-info" class="upload__info">Файл не выбран</span>
                </div>
            </div>
        </header>
        <nav class="tabs" role="tablist">
            <button class="tabs__tab" type="button" disabled>Дубли обращений</button>
            <button class="tabs__tab tabs__tab--active" type="button">Поиск по обращениям</button>
            <button class="tabs__tab" type="button" disabled>Поиск тегов</button>
        </nav>
        <main class="stage-container">
            <section class="section-card">
                <div class="section-card__header">
                    <h2>Поиск по тексту</h2>
                </div>
                <div class="section-card__body">
                    <div class="search-inline">
                        <input id="search-query" type="text" placeholder="Например: касса не распечаталась" autocomplete="off">
                        <button id="run-search" class="button button--primary" type="button" disabled>Найти</button>
                    </div>
                    <p class="section-card__hint">Ищем совпадения в полях «Название» и «Описание».</p>
                </div>
            </section>
            <section class="section-card section-card--results">
                <div class="section-card__header">
                    <h2>Результаты</h2>
                </div>
                <div class="section-card__body">
                    <div class="section-card__actions">
                        <span id="result-count">Найдено: 0</span>
                    </div>
                    <div class="table-scroll">
                        <table class="stage-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Название</th>
                                    <th>Описание</th>
                                    <th>Статус</th>
                                </tr>
                            </thead>
                            <tbody id="results-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script>
    (function(){
        function trimValue(value){
            if (value == null) {
                return '';
            }
            return String(value).replace(/\s+/g, ' ').trim();
        }
        function parseCsv(text){
            var lines = text.split(/\r?\n/);
            var header = null;
            var rows = [];
            for (var i = 0; i < lines.length; i += 1) {
                var line = lines[i];
                if (!line) {
                    continue;
                }
                var cols = line.split(';');
                if (!header) {
                    header = cols;
                    continue;
                }
                if (cols.length !== header.length) {
                    continue;
                }
                var record = {};
                for (var j = 0; j < header.length; j += 1) {
                    record[trimValue(header[j])] = trimValue(cols[j]);
                }
                rows.push(record);
            }
            return rows;
        }
        function containsText(record, query){
            var title = trimValue(record['Название'] || record['Title'] || '');
            var desc = trimValue(record['Описание'] || record['Description'] || '');
            var lower = query.toLowerCase();
            return title.toLowerCase().indexOf(lower) !== -1 || desc.toLowerCase().indexOf(lower) !== -1;
        }
        function renderResults(rows){
            var body = document.getElementById('results-body');
            var counter = document.getElementById('result-count');
            if (!body || !counter) {
                return;
            }
            body.innerHTML = '';
            counter.textContent = 'Найдено: ' + rows.length;
            for (var i = 0; i < rows.length; i += 1) {
                var row = rows[i];
                var tr = document.createElement('tr');
                var idCell = document.createElement('td');
                var link = document.createElement('a');
                link.href = 'https://sfera.vtb.ru/sd/support?open=' + encodeURIComponent(row['ID'] || '');
                link.textContent = row['ID'] || 'Без номера';
                link.target = '_blank';
                link.rel = 'noopener';
                idCell.appendChild(link);
                var titleCell = document.createElement('td');
                titleCell.textContent = row['Название'] || row['Title'] || 'Без названия';
                var descCell = document.createElement('td');
                descCell.textContent = row['Описание'] || row['Description'] || 'Без описания';
                var statusCell = document.createElement('td');
                statusCell.textContent = row['Статус'] || row['Status'] || 'Без статуса';
                tr.appendChild(idCell);
                tr.appendChild(titleCell);
                tr.appendChild(descCell);
                tr.appendChild(statusCell);
                body.appendChild(tr);
            }
        }
        var fileInput = document.getElementById('csv-file');
        var info = document.getElementById('upload-info');
        var runButton = document.getElementById('run-search');
        var queryInput = document.getElementById('search-query');
        var loadedRows = [];
        if (!fileInput || !info || !runButton || !queryInput) {
            return;
        }
        fileInput.addEventListener('change', function(){
            if (!fileInput.files || !fileInput.files.length) {
                info.textContent = 'Файл не выбран';
                loadedRows = [];
                runButton.disabled = true;
                renderResults([]);
                return;
            }
            var file = fileInput.files[0];
            info.textContent = 'Загружаем: ' + file.name;
            var reader = new FileReader();
            reader.onload = function(event){
                var text = event.target && event.target.result ? event.target.result : '';
                loadedRows = parseCsv(text);
                runButton.disabled = !loadedRows.length;
                renderResults([]);
            };
            reader.readAsText(file, 'utf-8');
        });
        runButton.addEventListener('click', function(){
            var query = trimValue(queryInput.value);
            if (!query) {
                renderResults([]);
                return;
            }
            var matches = [];
            for (var i = 0; i < loadedRows.length; i += 1) {
                if (containsText(loadedRows[i], query)) {
                    matches.push(loadedRows[i]);
                }
            }
            renderResults(matches);
        });
    })();
    </script>
</body>
</html>
